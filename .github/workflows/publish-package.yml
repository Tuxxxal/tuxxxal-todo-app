name: "Publish to GitHub Packages (Maven)"

on:
  workflow_run:
    workflows: ["CI / Build & Release"]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publish package to GitHub Packages
        run: |
          set +e
          OUTPUT=$(./gradlew --no-daemon publish 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            # GitHub Packages rejects re-uploading an existing version with HTTP 409.
            # That is not a failure for us: the version is already published.
            if echo "$OUTPUT" | grep -q "status code 409"; then
              echo "::notice::Version already exists in GitHub Packages, skipping publish."
              exit 0
            fi
            exit $STATUS
          fi
