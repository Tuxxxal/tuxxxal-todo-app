plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'org.example'
version = findProperty('version') ?: '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_23
    targetCompatibility = JavaVersion.VERSION_23
}

application {
    mainClass = 'org.example.TodoApp'
}

shadowJar {
    archiveBaseName = 'todo-app'
    archiveClassifier = ''
    archiveVersion = project.version.toString()
    mergeServiceFiles()
}

jar {
    enabled = false
}

// The fat jar replaces the thin jar and the runtime classpath, so the
// distribution tasks of the application plugin would read a stale classpath.
tasks.named('startScripts') {
    enabled = false
}
tasks.named('distZip') {
    enabled = false
}
tasks.named('distTar') {
    enabled = false
}

build.dependsOn shadowJar

test {
    useJUnitPlatform()
}
